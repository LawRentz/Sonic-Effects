<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Sonic Effects</title>

<style>
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial,sans-serif;
  }

  canvas{
    display:block;
  }

  #ui{
    position:fixed;
    top:18px;
    left:18px;
    z-index:1000;
  }

  #videoInput{
    display:none;
  }

  .sonicButton{
    display:inline-block;
    padding:14px 18px;
    border:2px solid #ffffff;
    border-radius:12px;
    background:#1357ff;
    color:#ffffff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
  }

  #playBtn{
    display:none;
    margin-left:8px;
  }

  #status{
    position:fixed;
    bottom:18px;
    left:18px;
    right:18px;
    z-index:1000;
    color:white;
    font-family:monospace;
    font-size:14px;
    text-align:center;
    pointer-events:none;
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
</head>

<body>

<div id="ui">

  <label
    id="chooseBtn"
    class="sonicButton"
    for="videoInput"
  >
    SELECT VIDEO
  </label>

  <input
    id="videoInput"
    type="file"
    accept="video/*"
  />

  <button
    id="playBtn"
    class="sonicButton"
    type="button"
  >
    PLAY VIDEO
  </button>

</div>

<div id="status">
  Select a video to begin.
</div>

<script>

let vid;

let analysisFrame;
let prevFrame;
let diffImg;

let haloLayer;
let analysisLayer;

let videoLoaded = false;
let videoPlaying = false;

let currentVideoURL = null;


/*
  MOTION SETTINGS
*/

let motionThreshold = 45;
let minBlobPixels = 500;


/*
  LOCK-ON SETTINGS
*/

let lockFrames = 3;
let lockDistance = 55;

let pendingTracks = [];


/*
  ANALYSIS RESOLUTION
*/

let analysisW = 480;
let analysisH = 360;


/*
  TRACK DATA
*/

let blobs = [];
let trackerHistory = [];


/*
  SONIC COLORS
*/

let sonicBlue = 225;
let sonicGold = 48;


/*
  SETUP
*/

function setup(){

  createCanvas(
    windowWidth,
    windowHeight
  );

  pixelDensity(1);
  frameRate(60);

  colorMode(
    HSB,
    360,
    100,
    100,
    100
  );


  haloLayer =
    createGraphics(
      width,
      height
    );

  haloLayer.colorMode(
    HSB,
    360,
    100,
    100,
    100
  );

  haloLayer.clear();


  analysisLayer =
    createGraphics(
      analysisW,
      analysisH
    );

  analysisLayer.pixelDensity(1);


  analysisFrame =
    createImage(
      analysisW,
      analysisH
    );

  prevFrame =
    createImage(
      analysisW,
      analysisH
    );

  diffImg =
    createImage(
      analysisW,
      analysisH
    );


  textFont('monospace');
  textStyle(BOLD);


  const input =
    document.getElementById(
      'videoInput'
    );

  const playButton =
    document.getElementById(
      'playBtn'
    );


  input.addEventListener(
    'change',
    handleVideoFile
  );


  playButton.addEventListener(
    'click',
    startVideoPlayback
  );
}


/*
  SELECT VIDEO
*/

function handleVideoFile(event){

  const file =
    event.target.files[0];

  if(!file){
    return;
  }


  if(vid){

    try{
      vid.pause();
    }
    catch(e){}

    vid.remove();
    vid = null;
  }


  if(currentVideoURL){

    URL.revokeObjectURL(
      currentVideoURL
    );
  }


  currentVideoURL =
    URL.createObjectURL(file);


  videoLoaded = false;
  videoPlaying = false;

  pendingTracks = [];
  trackerHistory = [];


  document.getElementById(
    'status'
  ).innerText =
    'Loading video...';


  document.getElementById(
    'playBtn'
  ).style.display =
    'none';


  document.getElementById(
    'chooseBtn'
  ).style.display =
    'inline-block';


  vid =
    createVideo(
      currentVideoURL
    );


  vid.hide();


  vid.elt.playsInline = true;

  vid.elt.setAttribute(
    'playsinline',
    ''
  );

  vid.elt.setAttribute(
    'webkit-playsinline',
    ''
  );


  /*
    LOAD MUTED FOR IPHONE
  */

  vid.elt.muted = true;
  vid.elt.defaultMuted = true;
  vid.elt.volume = 0;

  vid.elt.preload = 'auto';


  vid.elt.addEventListener(
    'loadedmetadata',
    prepareVideo,
    {once:true}
  );


  vid.elt.addEventListener(
    'error',
    function(){

      document.getElementById(
        'status'
      ).innerText =
        'Video could not load.';
    }
  );
}


/*
  PREP VIDEO
*/

function prepareVideo(){

  resetAnalysisBuffers();

  videoLoaded = true;


  document.getElementById(
    'status'
  ).innerText =
    'Video ready. Tap PLAY VIDEO.';


  document.getElementById(
    'playBtn'
  ).style.display =
    'inline-block';


  document.getElementById(
    'chooseBtn'
  ).style.display =
    'inline-block';
}


/*
  RESET ANALYSIS
*/

function resetAnalysisBuffers(){

  prevFrame =
    createImage(
      analysisW,
      analysisH
    );

  diffImg =
    createImage(
      analysisW,
      analysisH
    );


  prevFrame.loadPixels();


  for(
    let i = 0;
    i < prevFrame.pixels.length;
    i += 4
  ){

    prevFrame.pixels[i] = 0;
    prevFrame.pixels[i+1] = 0;
    prevFrame.pixels[i+2] = 0;
    prevFrame.pixels[i+3] = 255;
  }


  prevFrame.updatePixels();


  trackerHistory = [];
  pendingTracks = [];

  haloLayer.clear();
}


/*
  PLAY VIDEO
*/

function startVideoPlayback(){

  if(
    !vid ||
    !videoLoaded
  ){
    return;
  }


  resetAnalysisBuffers();


  if(
    vid.elt.ended ||
    vid.elt.currentTime >= vid.elt.duration
  ){

    vid.elt.currentTime = 0;
  }


  /*
    RESTORE ORIGINAL VIDEO AUDIO
  */

  vid.elt.muted = false;
  vid.elt.defaultMuted = false;
  vid.elt.volume = 1.0;


  const playPromise =
    vid.elt.play();


  if(
    playPromise !== undefined
  ){

    playPromise
      .then(() => {

        videoPlaying = true;


        document.getElementById(
          'playBtn'
        ).style.display =
          'none';


        document.getElementById(
          'chooseBtn'
        ).style.display =
          'none';


        document.getElementById(
          'status'
        ).innerText =
          '';

      })

      .catch(() => {

        document.getElementById(
          'status'
        ).innerText =
          'Tap PLAY VIDEO again.';


        document.getElementById(
          'playBtn'
        ).style.display =
          'inline-block';


        document.getElementById(
          'chooseBtn'
        ).style.display =
          'inline-block';
      });
  }
}


/*
  MAIN LOOP
*/

function draw(){

  background(0);


  if(
    !videoLoaded ||
    !vid
  ){

    drawStartScreen();

    return;
  }


  /*
    NATIVE VIDEO DISPLAY
  */

  drawVideoCover();


  if(
    !videoPlaying ||
    vid.elt.paused
  ){

    return;
  }


  /*
    LOW RES ANALYSIS COPY
  */

  analysisLayer.clear();

  analysisLayer.image(
    vid,
    0,
    0,
    analysisW,
    analysisH
  );


  analysisFrame =
    analysisLayer.get();


  analysisFrame.loadPixels();
  prevFrame.loadPixels();


  if(
    analysisFrame.pixels.length === 0 ||
    prevFrame.pixels.length === 0
  ){

    return;
  }


  diffImg.loadPixels();


  /*
    FRAME DIFFERENCE
  */

  for(
    let i = 0;
    i < analysisFrame.pixels.length;
    i += 4
  ){

    let d =
      dist(

        analysisFrame.pixels[i],
        analysisFrame.pixels[i+1],
        analysisFrame.pixels[i+2],

        prevFrame.pixels[i],
        prevFrame.pixels[i+1],
        prevFrame.pixels[i+2]

      );


    let v =
      d > motionThreshold
      ? 255
      : 0;


    diffImg.pixels[i] = v;
    diffImg.pixels[i+1] = v;
    diffImg.pixels[i+2] = v;
    diffImg.pixels[i+3] = 255;
  }


  diffImg.updatePixels();


  /*
    FIND RAW MOTION BLOBS
  */

  let rawBlobs =
    findBlobs(
      diffImg,
      analysisW,
      analysisH
    );


  /*
    3 FRAME LOCK-ON
  */

  blobs =
    applyLockOn(
      rawBlobs
    );


  /*
    GOLD HALO FADE
  */

  haloLayer.fill(
    0,
    0,
    0,
    62
  );

  haloLayer.noStroke();

  haloLayer.rect(
    0,
    0,
    width,
    height
  );


  let t =
    millis()/1000;


  let pulse =
    (
      sin(
        t * 1.2
      ) + 1
    ) / 2;


  let fit =
    getCoverFit();


  let centers = [];


  /*
    MAP ANALYSIS COORDINATES
    TO DISPLAY COORDINATES
  */

  for(
    let b of blobs
  ){

    let bx =
      (
        b.minX +
        b.maxX
      ) / 2;


    let by =
      (
        b.minY +
        b.maxY
      ) / 2;


    let normalizedX =
      bx /
      analysisW;


    let normalizedY =
      by /
      analysisH;


    let cx =
      fit.x +
      normalizedX *
      fit.w;


    let cy =
      fit.y +
      normalizedY *
      fit.h;


    centers.push({

      x:cx,
      y:cy,
      blob:b
    });


    /*
      GOLD HALO
    */

    let goldHue =
      sonicGold +
      sin(
        t * 0.7 +
        bx * 0.04
      ) * 6;


    let haloSize =
      map(
        b.count,
        minBlobPixels,
        3000,
        43,
        100
      );


    haloSize =
      constrain(
        haloSize,
        43,
        100
      );


    drawGoldHalo(
      haloLayer,
      cx,
      cy,
      haloSize,
      goldHue,
      pulse
    );
  }


  /*
    ADD GOLD GLOW
  */

  blendMode(ADD);

  image(
    haloLayer,
    0,
    0
  );

  blendMode(BLEND);


  /*
    ORIGINAL SONIC VISUAL SYSTEM
  */

  drawConnectorLines(
    centers
  );


  updateTrackerHistory(
    centers
  );


  drawMotionTails();


  drawTrackers(
    centers
  );


  /*
    STORE CURRENT FRAME
  */

  prevFrame.copy(
    analysisFrame,
    0,
    0,
    analysisW,
    analysisH,
    0,
    0,
    analysisW,
    analysisH
  );


  /*
    VIDEO FINISHED
  */

  if(
    vid.elt.ended
  ){

    videoPlaying = false;

    pendingTracks = [];


    document.getElementById(
      'playBtn'
    ).style.display =
      'inline-block';


    document.getElementById(
      'chooseBtn'
    ).style.display =
      'inline-block';


    document.getElementById(
      'status'
    ).innerText =
      'Video finished. Tap PLAY VIDEO to replay.';
  }
}


/*
  3 FRAME LOCK-ON
*/

function applyLockOn(
  rawBlobs
){

  let confirmed = [];

  let usedTracks =
    new Set();


  for(
    let blob of rawBlobs
  ){

    let bx =
      (
        blob.minX +
        blob.maxX
      ) / 2;


    let by =
      (
        blob.minY +
        blob.maxY
      ) / 2;


    let bestIndex =
      -1;


    let bestDistance =
      Infinity;


    for(
      let i = 0;
      i < pendingTracks.length;
      i++
    ){

      if(
        usedTracks.has(i)
      ){
        continue;
      }


      let tr =
        pendingTracks[i];


      let d =
        dist(
          bx,
          by,
          tr.x,
          tr.y
        );


      if(
        d < lockDistance &&
        d < bestDistance
      ){

        bestDistance =
          d;

        bestIndex =
          i;
      }
    }


    if(
      bestIndex >= 0
    ){

      let tr =
        pendingTracks[
          bestIndex
        ];


      tr.x =
        bx;

      tr.y =
        by;


      tr.framesSeen++;

      tr.missedFrames =
        0;


      tr.blob =
        blob;


      usedTracks.add(
        bestIndex
      );


      if(
        tr.framesSeen >=
        lockFrames
      ){

        confirmed.push(
          blob
        );
      }

    } else {


      pendingTracks.push({

        x:bx,
        y:by,

        framesSeen:1,

        missedFrames:0,

        blob:blob
      });
    }
  }


  for(
    let i = 0;
    i < pendingTracks.length;
    i++
  ){

    if(
      !usedTracks.has(i)
    ){

      pendingTracks[i]
        .missedFrames++;
    }
  }


  pendingTracks =
    pendingTracks.filter(
      track =>
        track.missedFrames <= 1
    );


  return confirmed;
}


/*
  TRACKER HISTORY
*/

function updateTrackerHistory(
  centers
){

  trackerHistory.push(

    centers.map(
      p => ({
        x:p.x,
        y:p.y
      })
    )
  );


  if(
    trackerHistory.length > 7
  ){

    trackerHistory.shift();
  }
}


/*
  ORIGINAL MOTION TAILS
*/

function drawMotionTails(){

  if(
    trackerHistory.length < 2
  ){
    return;
  }


  for(
    let h = 1;
    h < trackerHistory.length;
    h++
  ){

    let previous =
      trackerHistory[
        h-1
      ];


    let current =
      trackerHistory[
        h
      ];


    let alpha =
      map(
        h,
        1,
        trackerHistory.length-1,
        15,
        78
      );


    stroke(
      sonicBlue,
      100,
      100,
      alpha
    );


    strokeWeight(
      2.5
    );


    let count =
      min(
        previous.length,
        current.length
      );


    for(
      let i = 0;
      i < count;
      i++
    ){

      line(
        previous[i].x,
        previous[i].y,
        current[i].x,
        current[i].y
      );
    }
  }
}


/*
  CONNECTOR LINES
*/

function drawConnectorLines(
  centers
){

  if(
    centers.length < 2
  ){
    return;
  }


  stroke(
    sonicBlue,
    95,
    100,
    82
  );

  strokeWeight(3);


  for(
    let i = 0;
    i < centers.length-1;
    i++
  ){

    line(
      centers[i].x,
      centers[i].y,
      centers[i+1].x,
      centers[i+1].y
    );


    let mx =
      (
        centers[i].x +
        centers[i+1].x
      ) / 2;


    let my =
      (
        centers[i].y +
        centers[i+1].y
      ) / 2;


    noStroke();


    fill(
      sonicBlue,
      90,
      100,
      100
    );


    circle(
      mx,
      my,
      7
    );


    fill(
      0,
      0,
      100,
      100
    );


    circle(
      mx,
      my,
      2.5
    );


    stroke(
      sonicBlue,
      95,
      100,
      82
    );

    strokeWeight(3);
  }
}


/*
  TRACKER GRAPHICS
*/

function drawTrackers(
  centers
){

  for(
    let p of centers
  ){

    let b =
      p.blob;


    let cx =
      p.x;


    let cy =
      p.y;


    let side =
      map(
        b.count,
        minBlobPixels,
        3000,
        90,
        185
      );


    side =
      constrain(
        side,
        90,
        185
      );


    let half =
      side / 2;


    /*
      BLUE TRACKER BOX
    */

    stroke(
      sonicBlue,
      100,
      100,
      100
    );

    strokeWeight(3.5);

    noFill();


    rect(
      cx-half,
      cy-half,
      side,
      side,
      4
    );


    /*
      WHITE CORNER BRACKETS
    */

    let corner =
      19;


    stroke(
      0,
      0,
      100,
      100
    );

    strokeWeight(4);


    line(
      cx-half,
      cy-half,
      cx-half+corner,
      cy-half
    );


    line(
      cx-half,
      cy-half,
      cx-half,
      cy-half+corner
    );


    line(
      cx+half,
      cy-half,
      cx+half-corner,
      cy-half
    );


    line(
      cx+half,
      cy-half,
      cx+half,
      cy-half+corner
    );


    line(
      cx-half,
      cy+half,
      cx-half+corner,
      cy+half
    );


    line(
      cx-half,
      cy+half,
      cx-half,
      cy+half-corner
    );


    line(
      cx+half,
      cy+half,
      cx+half-corner,
      cy+half
    );


    line(
      cx+half,
      cy+half,
      cx+half,
      cy+half-corner
    );


    /*
      BLUE CROSSHAIR
    */

    stroke(
      sonicBlue,
      100,
      100,
      100
    );

    strokeWeight(3);


    line(
      cx-19,
      cy,
      cx+19,
      cy
    );


    line(
      cx,
      cy-19,
      cx,
      cy+19
    );


    /*
      WHITE TARGET RING
    */

    noFill();

    stroke(
      0,
      0,
      100,
      100
    );

    strokeWeight(2.5);


    circle(
      cx,
      cy,
      20
    );


    /*
      GOLD CENTER DOT
    */

    noStroke();

    fill(
      sonicGold,
      100,
      100,
      100
    );


    circle(
      cx,
      cy,
      8
    );


    /*
      BLUE SCAN LINE
    */

    stroke(
      sonicBlue,
      100,
      100,
      100
    );

    strokeWeight(4);


    let scanY =
      cy +
      sin(
        millis()/180
      ) *
      half *
      0.65;


    line(
      cx-half+10,
      scanY,
      cx+half-10,
      scanY
    );


    /*
      COORDINATES ONLY
    */

    let label =
      `(${int(cx)}, ${int(cy)})`;


    textAlign(
      CENTER,
      CENTER
    );

    textSize(20);

    textStyle(BOLD);


    let labelWidth =
      textWidth(label) + 20;


    let labelHeight =
      30;


    let labelY =
      cy-half-28;


    /*
      LABEL BACKGROUND
    */

    noStroke();

    fill(
      0,
      0,
      0,
      80
    );


    rect(
      cx-labelWidth/2,
      labelY-labelHeight/2,
      labelWidth,
      labelHeight,
      3
    );


    /*
      BLUE LABEL BORDER
    */

    noFill();

    stroke(
      sonicBlue,
      100,
      100,
      100
    );

    strokeWeight(2);


    rect(
      cx-labelWidth/2,
      labelY-labelHeight/2,
      labelWidth,
      labelHeight,
      3
    );


    /*
      WHITE COORDINATES
    */

    noStroke();

    fill(
      0,
      0,
      100,
      100
    );


    text(
      label,
      cx,
      labelY
    );
  }
}


/*
  GOLD HALO
*/

function drawGoldHalo(
  layer,
  x,
  y,
  r,
  goldHue,
  pulse
){

  layer.push();

  layer.translate(
    x,
    y
  );

  layer.noFill();


  /*
    VERY SOFT OUTER GLOW
  */

  layer.stroke(
    goldHue,
    90,
    100,
    8
  );

  layer.strokeWeight(16);

  layer.circle(
    0,
    0,
    r * 2.08
  );


  layer.stroke(
    goldHue,
    90,
    100,
    13
  );

  layer.strokeWeight(8);

  layer.circle(
    0,
    0,
    r * 2.03
  );


  /*
    MAIN GOLD RINGS
  */

  for(
    let i = 0;
    i < 3;
    i++
  ){

    let alpha =
      map(
        i,
        0,
        2,
        58,
        16
      );


    layer.stroke(
      goldHue,
      92,
      100,
      alpha
    );


    layer.strokeWeight(
      map(
        i,
        0,
        2,
        4.5,
        1.5
      )
    );


    let ringSize =
      r *
      (
        1 +
        0.018 *
        pulse
      );


    layer.circle(
      0,
      0,
      ringSize*2
    );


    r *= 0.86;
  }


  /*
    GOLD ORBIT PARTICLES
  */

  layer.noStroke();


  for(
    let i = 0;
    i < 8;
    i++
  ){

    let a =
      TWO_PI *
      i/8 +
      millis()/2500;


    let orbit =
      r * 1.48;


    layer.fill(
      goldHue,
      90,
      100,
      30
    );


    layer.circle(
      cos(a)*orbit,
      sin(a)*orbit,
      2.5
    );
  }


  layer.pop();
}


/*
  VIDEO DISPLAY
*/

function drawVideoCover(){

  let fit =
    getCoverFit();


  image(
    vid,
    fit.x,
    fit.y,
    fit.w,
    fit.h
  );
}


/*
  PRESERVE VIDEO ASPECT RATIO
*/

function getCoverFit(){

  let vw =
    vid.elt.videoWidth;


  let vh =
    vid.elt.videoHeight;


  if(
    !vw ||
    !vh
  ){

    return{

      x:0,
      y:0,

      w:width,
      h:height
    };
  }


  let videoRatio =
    vw /
    vh;


  let screenRatio =
    width /
    height;


  let drawW;
  let drawH;


  if(
    screenRatio >
    videoRatio
  ){

    drawW =
      width;


    drawH =
      width /
      videoRatio;

  } else {


    drawH =
      height;


    drawW =
      height *
      videoRatio;
  }


  return{

    x:
      (width-drawW)/2,

    y:
      (height-drawH)/2,

    w:
      drawW,

    h:
      drawH
  };
}


/*
  START SCREEN
*/

function drawStartScreen(){

  fill(
    0,
    0,
    100,
    100
  );

  noStroke();


  textAlign(
    CENTER,
    CENTER
  );


  textSize(30);


  text(
    'SONIC EFFECTS',
    width/2,
    height/2 - 25
  );


  fill(
    sonicBlue,
    100,
    100,
    100
  );


  textSize(16);


  text(
    'SELECT A VIDEO TO BEGIN',
    width/2,
    height/2 + 25
  );
}


/*
  FIND MOTION BLOBS
*/

function findBlobs(
  img,
  w,
  h
){

  let visited =
    new Uint8Array(
      w*h
    );


  img.loadPixels();


  let found = [];


  for(
    let y = 0;
    y < h;
    y++
  ){

    for(
      let x = 0;
      x < w;
      x++
    ){

      let idx =
        x +
        y*w;


      let p =
        img.pixels[
          idx*4
        ];


      if(
        p > 128 &&
        !visited[idx]
      ){

        let b =
          flood(
            x,
            y,
            visited,
            img,
            w,
            h
          );


        if(
          b.count >
          minBlobPixels
        ){

          found.push(
            b
          );
        }
      }
    }
  }


  return found;
}


/*
  FLOOD FILL
*/

function flood(
  x,
  y,
  vis,
  img,
  w,
  h
){

  let st =
    [[x,y]];


  let minX = x;
  let maxX = x;

  let minY = y;
  let maxY = y;

  let c = 0;


  while(
    st.length
  ){

    let [
      cx,
      cy
    ] =
      st.pop();


    if(
      cx < 0 ||
      cy < 0 ||
      cx >= w ||
      cy >= h
    ){
      continue;
    }


    let idx =
      cx +
      cy*w;


    if(
      vis[idx]
    ){
      continue;
    }


    let p =
      idx*4;


    if(
      img.pixels[p] <= 128
    ){
      continue;
    }


    vis[idx] = 1;

    c++;


    minX =
      min(
        minX,
        cx
      );


    maxX =
      max(
        maxX,
        cx
      );


    minY =
      min(
        minY,
        cy
      );


    maxY =
      max(
        maxY,
        cy
      );


    st.push(
      [cx+1,cy],
      [cx-1,cy],
      [cx,cy+1],
      [cx,cy-1]
    );
  }


  return{

    minX,
    maxX,

    minY,
    maxY,

    count:c
  };
}


/*
  WINDOW RESIZE
*/

function windowResized(){

  resizeCanvas(
    windowWidth,
    windowHeight
  );


  haloLayer =
    createGraphics(
      width,
      height
    );


  haloLayer.colorMode(
    HSB,
    360,
    100,
    100,
    100
  );


  haloLayer.clear();


  trackerHistory = [];
  pendingTracks = [];
}
