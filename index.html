<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Sonic Effects</title>

<style>
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial,sans-serif;
  }

  canvas{
    display:block;
  }

  #ui{
    position:fixed;
    top:18px;
    left:18px;
    z-index:1000;
  }

  #videoInput{
    display:none;
  }

  .sonicButton{
    display:inline-block;
    padding:14px 18px;
    border:2px solid #ffffff;
    border-radius:12px;
    background:#1357ff;
    color:#ffffff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
  }

  #playBtn{
    display:none;
    margin-left:8px;
  }

  #status{
    position:fixed;
    bottom:18px;
    left:18px;
    right:18px;
    z-index:1000;

    color:white;
    font-family:monospace;
    font-size:14px;

    text-align:center;

    pointer-events:none;
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
</head>

<body>

<div id="ui">

  <label
    id="chooseBtn"
    class="sonicButton"
    for="videoInput"
  >
    SELECT VIDEO
  </label>

  <input
    id="videoInput"
    type="file"
    accept="video/*"
  />

  <button
    id="playBtn"
    class="sonicButton"
    type="button"
  >
    PLAY VIDEO
  </button>

</div>

<div id="status">
  Select a video to begin.
</div>

<script>

let vid;

let prevFrame;
let diffImg;
let haloLayer;

let videoLoaded = false;
let videoPlaying = false;

let currentVideoURL = null;

let motionThreshold = 45;
let minBlobPixels = 500;

let blobs = [];
let trackerHistory = [];

let sonicBlue = 225;
let sonicGold = 48;


/*
  SETUP
*/

function setup(){

  createCanvas(
    windowWidth,
    windowHeight
  );

  pixelDensity(1);

  frameRate(60);

  colorMode(
    HSB,
    360,
    100,
    100,
    100
  );

  haloLayer =
    createGraphics(
      width,
      height
    );

  haloLayer.colorMode(
    HSB,
    360,
    100,
    100,
    100
  );

  haloLayer.clear();

  textFont('monospace');

  textStyle(BOLD);


  const input =
    document.getElementById(
      'videoInput'
    );

  const playButton =
    document.getElementById(
      'playBtn'
    );


  input.addEventListener(
    'change',
    handleVideoFile
  );


  playButton.addEventListener(
    'click',
    startVideoPlayback
  );
}


/*
  VIDEO SELECTION
*/

function handleVideoFile(event){

  const file =
    event.target.files[0];

  if(!file){
    return;
  }


  /*
    REMOVE OLD VIDEO
  */

  if(vid){

    try{
      vid.pause();
    }
    catch(e){}

    vid.remove();

    vid = null;
  }


  /*
    RELEASE PREVIOUS OBJECT URL
  */

  if(currentVideoURL){

    URL.revokeObjectURL(
      currentVideoURL
    );
  }


  currentVideoURL =
    URL.createObjectURL(file);


  videoLoaded = false;
  videoPlaying = false;

  trackerHistory = [];


  document.getElementById(
    'status'
  ).innerText =
    'Loading video...';


  document.getElementById(
    'playBtn'
  ).style.display =
    'none';


  /*
    CREATE VIDEO
  */

  vid =
    createVideo(
      currentVideoURL
    );


  vid.hide();


  /*
    IMPORTANT IPHONE SETTINGS
  */

  vid.elt.playsInline = true;

  vid.elt.setAttribute(
    'playsinline',
    ''
  );

  vid.elt.setAttribute(
    'webkit-playsinline',
    ''
  );

  vid.elt.muted = true;

  vid.elt.defaultMuted = true;

  vid.elt.volume = 0;

  vid.elt.preload = 'auto';


  /*
    WHEN METADATA IS READY
  */

  vid.elt.addEventListener(
    'loadedmetadata',
    prepareVideo,
    {once:true}
  );


  /*
    VIDEO ERROR
  */

  vid.elt.addEventListener(
    'error',
    function(){

      document.getElementById(
        'status'
      ).innerText =
        'Video could not load. Try another video format.';
    }
  );
}


/*
  PREPARE VIDEO
*/

function prepareVideo(){

  vid.size(
    480,
    360
  );


  prevFrame =
    createImage(
      480,
      360
    );


  diffImg =
    createImage(
      480,
      360
    );


  /*
    CLEAR PREVIOUS FRAME
  */

  prevFrame.loadPixels();

  for(
    let i = 0;
    i < prevFrame.pixels.length;
    i += 4
  ){

    prevFrame.pixels[i] = 0;
    prevFrame.pixels[i+1] = 0;
    prevFrame.pixels[i+2] = 0;
    prevFrame.pixels[i+3] = 255;
  }

  prevFrame.updatePixels();


  trackerHistory = [];

  videoLoaded = true;


  document.getElementById(
    'status'
  ).innerText =
    'Video ready. Tap PLAY VIDEO.';


  document.getElementById(
    'playBtn'
  ).style.display =
    'inline-block';
}


/*
  START VIDEO

  This function is triggered
  directly by the user's tap.
  Much more reliable on iPhone.
*/

function startVideoPlayback(){

  if(
    !vid ||
    !videoLoaded
  ){
    return;
  }


  const playPromise =
    vid.elt.play();


  if(
    playPromise !== undefined
  ){

    playPromise
      .then(() => {

        videoPlaying = true;

        document.getElementById(
          'playBtn'
        ).style.display =
          'none';


        document.getElementById(
          'chooseBtn'
        ).style.opacity =
          '0.35';


        document.getElementById(
          'status'
        ).innerText =
          '';

      })

      .catch(error => {

        console.log(error);

        document.getElementById(
          'status'
        ).innerText =
          'Tap PLAY VIDEO again.';
      });
  }
}


/*
  MAIN LOOP
*/

function draw(){

  background(0);


  if(
    !videoLoaded ||
    !vid
  ){

    drawStartScreen();

    return;
  }


  /*
    SHOW VIDEO EVEN BEFORE PLAYBACK
  */

  image(
    vid,
    0,
    0,
    width,
    height
  );


  /*
    DON'T TRACK UNTIL VIDEO PLAYS
  */

  if(
    !videoPlaying ||
    vid.elt.paused
  ){

    return;
  }


  blobs = [];


  vid.loadPixels();

  prevFrame.loadPixels();


  if(
    vid.pixels.length === 0 ||
    prevFrame.pixels.length === 0
  ){

    return;
  }


  diffImg.loadPixels();


  /*
    FRAME DIFFERENCE
  */

  for(
    let i = 0;
    i < vid.pixels.length;
    i += 4
  ){

    let d =
      dist(

        vid.pixels[i],
        vid.pixels[i+1],
        vid.pixels[i+2],

        prevFrame.pixels[i],
        prevFrame.pixels[i+1],
        prevFrame.pixels[i+2]

      );


    let v =
      d > motionThreshold
      ? 255
      : 0;


    diffImg.pixels[i] =
      v;

    diffImg.pixels[i+1] =
      v;

    diffImg.pixels[i+2] =
      v;

    diffImg.pixels[i+3] =
      255;
  }


  diffImg.updatePixels();


  /*
    FIND BLOBS
  */

  blobs =
    findBlobs(
      diffImg,
      480,
      360
    );


  /*
    GOLD HALO FADE
  */

  haloLayer.fill(
    0,
    0,
    0,
    62
  );

  haloLayer.noStroke();

  haloLayer.rect(
    0,
    0,
    width,
    height
  );


  const t =
    millis()/1000;


  const pulse =
    (
      sin(
        t * 1.2
      ) + 1
    ) / 2;


  let centers = [];


  for(
    let b of blobs
  ){

    let cx =
      map(
        (b.minX+b.maxX)/2,
        0,
        480,
        0,
        width
      );


    let cy =
      map(
        (b.minY+b.maxY)/2,
        0,
        360,
        0,
        height
      );


    centers.push({
      x:cx,
      y:cy
    });


    let goldHue =
      sonicGold +

      sin(
        t * 0.7 +
        b.minX * 0.04
      ) * 6;


    let haloSize =
      map(
        b.count,
        minBlobPixels,
        3000,
        43,
        100
      );


    haloSize =
      constrain(
        haloSize,
        43,
        100
      );


    drawGoldHalo(
      haloLayer,
      cx,
      cy,
      haloSize,
      goldHue,
      pulse
    );
  }


  /*
    GOLD GLOW
  */

  blendMode(ADD);

  image(
    haloLayer,
    0,
    0
  );

  blendMode(BLEND);


  /*
    SONIC BLUE MACHINE VISION
  */

  drawConnectorLines(
    centers
  );

  updateTrackerHistory(
    centers
  );

  drawMotionTails();

  drawTrackers();


  /*
    SAVE FRAME
  */

  prevFrame.copy(
    vid,
    0,
    0,
    480,
    360,
    0,
    0,
    480,
    360
  );


  /*
    RESTART AT END
  */

  if(
    vid.elt.ended
  ){

    vid.elt.currentTime = 0;

    videoPlaying = false;


    document.getElementById(
      'playBtn'
    ).style.display =
      'inline-block';


    document.getElementById(
      'status'
    ).innerText =
      'Video finished. Tap PLAY VIDEO to replay.';
  }
}


/*
  START SCREEN
*/

function drawStartScreen(){

  fill(
    0,
    0,
    100,
    100
  );

  noStroke();

  textAlign(
    CENTER,
    CENTER
  );

  textSize(30);

  text(
    'SONIC EFFECTS',
    width/2,
    height/2 - 25
  );


  fill(
    sonicBlue,
    100,
    100,
    100
  );

  textSize(16);

  text(
    'SELECT A VIDEO TO BEGIN',
    width/2,
    height/2 + 25
  );
}


/*
  GOLD HALO
*/

function drawGoldHalo(
  layer,
  x,
  y,
  r,
  goldHue,
  pulse
){

  layer.push();

  layer.translate(
    x,
    y
  );

  layer.noFill();


  layer.stroke(
    goldHue,
    90,
    100,
    8
  );

  layer.strokeWeight(16);

  layer.circle(
    0,
    0,
    r * 2.08
  );


  layer.stroke(
    goldHue,
    90,
    100,
    13
  );

  layer.strokeWeight(8);

  layer.circle(
    0,
    0,
    r * 2.03
  );


  for(
    let i=0;
    i<3;
    i++
  ){

    let alpha =
      map(
        i,
        0,
        2,
        58,
        16
      );


    layer.stroke(
      goldHue,
      92,
      100,
      alpha
    );


    layer.strokeWeight(
      map(
        i,
        0,
        2,
        4.5,
        1.5
      )
    );


    let ringSize =
      r *
      (
        1 +
        0.018*pulse
      );


    layer.circle(
      0,
      0,
      ringSize*2
    );


    r *= 0.86;
  }


  layer.noStroke();


  for(
    let i=0;
    i<8;
    i++
  ){

    let a =
      TWO_PI *
      i/8 +
      millis()/2500;


    let orbit =
      r*1.48;


    layer.fill(
      goldHue,
      90,
      100,
      30
    );


    layer.circle(
      cos(a)*orbit,
      sin(a)*orbit,
      2.5
    );
  }


  layer.pop();
}


/*
  BLUE CONNECTIONS
*/

function drawConnectorLines(
  centers
){

  if(
    centers.length < 2
  ){
    return;
  }


  stroke(
    sonicBlue,
    95,
    100,
    90
  );

  strokeWeight(3);


  for(
    let i=0;
    i<centers.length-1;
    i++
  ){

    line(
      centers[i].x,
      centers[i].y,
      centers[i+1].x,
      centers[i+1].y
    );


    let mx =
      (
        centers[i].x +
        centers[i+1].x
      )/2;


    let my =
      (
        centers[i].y +
        centers[i+1].y
      )/2;


    noStroke();


    fill(
      sonicBlue,
      90,
      100,
      100
    );


    circle(
      mx,
      my,
      7
    );


    fill(
      0,
      0,
      100,
      100
    );


    circle(
      mx,
      my,
      2.5
    );


    stroke(
      sonicBlue,
      95,
      100,
      90
    );

    strokeWeight(3);
  }
}


/*
  HISTORY
*/

function updateTrackerHistory(
  centers
){

  trackerHistory.push(
    centers.map(
      p => ({
        x:p.x,
        y:p.y
      })
    )
  );


  if(
    trackerHistory.length > 7
  ){

    trackerHistory.shift();
  }
}


/*
  BLUE MOVEMENT TRAILS
*/

function drawMotionTails(){

  if(
    trackerHistory.length < 2
  ){
    return;
  }


  for(
    let frame=1;
    frame<trackerHistory.length;
    frame++
  ){

    let previous =
      trackerHistory[
        frame-1
      ];


    let current =
      trackerHistory[
        frame
      ];


    let count =
      min(
        previous.length,
        current.length
      );


    let alpha =
      map(
        frame,
        1,
        trackerHistory.length-1,
        15,
        78
      );


    stroke(
      sonicBlue,
      95,
      100,
      alpha
    );


    strokeWeight(2.5);


    for(
      let i=0;
      i<count;
      i++
    ){

      line(
        previous[i].x,
        previous[i].y,
        current[i].x,
        current[i].y
      );
    }
  }
}


/*
  MACHINE VISION TRACKERS
*/

function drawTrackers(){

  for(
    let b of blobs
  ){

    let cx =
      map(
        (b.minX+b.maxX)/2,
        0,
        480,
        0,
        width
      );


    let cy =
      map(
        (b.minY+b.maxY)/2,
        0,
        360,
        0,
        height
      );


    let side =
      map(
        b.count,
        minBlobPixels,
        3000,
        90,
        185
      );


    side =
      constrain(
        side,
        90,
        185
      );


    let half =
      side/2;


    /*
      BLUE BOX
    */

    stroke(
      sonicBlue,
      100,
      100,
      100
    );

    strokeWeight(3.5);

    noFill();

    rect(
      cx-half,
      cy-half,
      side,
      side,
      4
    );


    /*
      WHITE CORNERS
    */

    let corner=19;

    stroke(
      0,
      0,
      100,
      100
    );

    strokeWeight(4);


    line(cx-half,cy-half,cx-half+corner,cy-half);
    line(cx-half,cy-half,cx-half,cy-half+corner);

    line(cx+half,cy-half,cx+half-corner,cy-half);
    line(cx+half,cy-half,cx+half,cy-half+corner);

    line(cx-half,cy+half,cx-half+corner,cy+half);
    line(cx-half,cy+half,cx-half,cy+half-corner);

    line(cx+half,cy+half,cx+half-corner,cy+half);
    line(cx+half,cy+half,cx+half,cy+half-corner);


    /*
      BLUE CROSSHAIR
    */

    stroke(
      sonicBlue,
      100,
      100,
      100
    );

    strokeWeight(3);

    line(
      cx-19,
      cy,
      cx+19,
      cy
    );

    line(
      cx,
      cy-19,
      cx,
      cy+19
    );


    /*
      WHITE TARGET
    */

    noFill();

    stroke(
      0,
      0,
      100,
      100
    );

    strokeWeight(2.5);

    circle(
      cx,
      cy,
      20
    );


    /*
      GOLD DOT
    */

    noStroke();

    fill(
      sonicGold,
      100,
      100,
      100
    );

    circle(
      cx,
      cy,
      8
    );


    /*
      BLUE SCAN LINE
    */

    stroke(
      sonicBlue,
      100,
      100,
      100
    );

    strokeWeight(4);


    let scanY =
      cy +
      sin(
        millis()/180
      ) *
      half *
      0.65;


    line(
      cx-half+10,
      scanY,
      cx+half-10,
      scanY
    );


    /*
      COORDINATES
    */

    let label =
      `(${int(cx)}, ${int(cy)})`;


    textAlign(
      CENTER,
      CENTER
    );

    textSize(20);

    textStyle(BOLD);


    let labelWidth =
      textWidth(label)+20;


    let labelHeight=30;


    let labelY =
      cy-half-28;


    noStroke();

    fill(
      0,
      0,
      0,
      80
    );


    rect(
      cx-labelWidth/2,
      labelY-labelHeight/2,
      labelWidth,
      labelHeight,
      3
    );


    noFill();

    stroke(
      sonicBlue,
      100,
      100,
      100
    );

    strokeWeight(2);


    rect(
      cx-labelWidth/2,
      labelY-labelHeight/2,
      labelWidth,
      labelHeight,
      3
    );


    noStroke();

    fill(
      0,
      0,
      100,
      100
    );


    text(
      label,
      cx,
      labelY
    );
  }
}


/*
  BLOB DETECTION
*/

function findBlobs(
  img,
  w,
  h
){

  let visited =
    new Uint8Array(
      w*h
    );


  img.loadPixels();


  let found=[];


  for(
    let y=0;
    y<h;
    y++
  ){

    for(
      let x=0;
      x<w;
      x++
    ){

      let idx =
        x+y*w;


      let p =
        img.pixels[
          idx*4
        ];


      if(
        p>128 &&
        !visited[idx]
      ){

        let b =
          flood(
            x,
            y,
            visited,
            img,
            w,
            h
          );


        if(
          b.count >
          minBlobPixels
        ){

          found.push(b);
        }
      }
    }
  }


  return found;
}


/*
  FLOOD FILL
*/

function flood(
  x,
  y,
  vis,
  img,
  w,
  h
){

  let st=[[x,y]];

  let minX=x;
  let maxX=x;

  let minY=y;
  let maxY=y;

  let c=0;


  while(
    st.length
  ){

    let [
      cx,
      cy
    ] =
      st.pop();


    if(
      cx<0 ||
      cy<0 ||
      cx>=w ||
      cy>=h
    ){
      continue;
    }


    let idx =
      cx+cy*w;


    if(
      vis[idx]
    ){
      continue;
    }


    let p =
      idx*4;


    if(
      img.pixels[p] <= 128
    ){
      continue;
    }


    vis[idx]=1;

    c++;


    minX=min(minX,cx);
    maxX=max(maxX,cx);

    minY=min(minY,cy);
    maxY=max(maxY,cy);


    st.push(
      [cx+1,cy],
      [cx-1,cy],
      [cx,cy+1],
      [cx,cy-1]
    );
  }


  return{
    minX,
    maxX,
    minY,
    maxY,
    count:c
  };
}


/*
  RESIZE / ROTATION
*/

function windowResized(){

  resizeCanvas(
    windowWidth,
    windowHeight
  );


  haloLayer =
    createGraphics(
      width,
      height
    );


  haloLayer.colorMode(
    HSB,
    360,
    100,
    100,
    100
  );


  haloLayer.clear();


  trackerHistory=[];
}

</script>

</body>
</html>
