<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Sonic Effects</title>

<style>
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial,sans-serif;
  }

  canvas{
    display:block;
  }

  #ui{
    position:fixed;
    top:18px;
    left:18px;
    z-index:1000;
  }

  #videoInput{
    display:none;
  }

  .sonicButton{
    display:inline-block;
    padding:14px 18px;
    border:2px solid #ffffff;
    border-radius:12px;
    background:#1357ff;
    color:#ffffff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
  }

  #playBtn{
    display:none;
    margin-left:8px;
  }

  #status{
    position:fixed;
    bottom:18px;
    left:18px;
    right:18px;
    z-index:1000;
    color:white;
    font-family:monospace;
    font-size:14px;
    text-align:center;
    pointer-events:none;
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
</head>

<body>

<div id="ui">

  <label
    id="chooseBtn"
    class="sonicButton"
    for="videoInput"
  >
    SELECT VIDEO
  </label>

  <input
    id="videoInput"
    type="file"
    accept="video/*"
  />

  <button
    id="playBtn"
    class="sonicButton"
    type="button"
  >
    PLAY VIDEO
  </button>

</div>

<div id="status">
  Select a video to begin.
</div>

<script>

let vid;

let analysisFrame;
let prevFrame;
let diffImg;

let haloLayer;
let analysisLayer;

let videoLoaded = false;
let videoPlaying = false;

let currentVideoURL = null;


/*
  MOTION SETTINGS
*/

let motionThreshold = 45;
let minBlobPixels = 500;


/*
  LOCK-ON SETTINGS
*/

let lockFrames = 3;
let lockDistance = 55;

let pendingTracks = [];


/*
  SPEED-REACTIVE TRAIL SETTINGS

  Increase maxTrailLength for
  more dramatic speed streaks.
*/

let maxTrailHistory = 12;
let velocityTrailStrength = 1.15;
let maxTrailLength = 220;


/*
  INTERNAL TRACKING RESOLUTION
*/

let analysisW = 480;
let analysisH = 360;


/*
  TRACK DATA
*/

let blobs = [];
let activeTrackers = [];
let nextTrackerId = 1;


/*
  SONIC COLORS
*/

let sonicBlue = 225;
let sonicGold = 48;


/*
  SETUP
*/

function setup(){

  createCanvas(
    windowWidth,
    windowHeight
  );

  pixelDensity(1);
  frameRate(60);

  colorMode(
    HSB,
    360,
    100,
    100,
    100
  );


  haloLayer =
    createGraphics(
      width,
      height
    );

  haloLayer.colorMode(
    HSB,
    360,
    100,
    100,
    100
  );

  haloLayer.clear();


  analysisLayer =
    createGraphics(
      analysisW,
      analysisH
    );

  analysisLayer.pixelDensity(1);


  analysisFrame =
    createImage(
      analysisW,
      analysisH
    );

  prevFrame =
    createImage(
      analysisW,
      analysisH
    );

  diffImg =
    createImage(
      analysisW,
      analysisH
    );


  textFont('monospace');
  textStyle(BOLD);


  const input =
    document.getElementById(
      'videoInput'
    );

  const playButton =
    document.getElementById(
      'playBtn'
    );


  input.addEventListener(
    'change',
    handleVideoFile
  );


  playButton.addEventListener(
    'click',
    startVideoPlayback
  );
}


/*
  SELECT VIDEO
*/

function handleVideoFile(event){

  const file =
    event.target.files[0];

  if(!file){
    return;
  }


  if(vid){

    try{
      vid.pause();
    }
    catch(e){}

    vid.remove();
    vid = null;
  }


  if(currentVideoURL){

    URL.revokeObjectURL(
      currentVideoURL
    );
  }


  currentVideoURL =
    URL.createObjectURL(file);


  videoLoaded = false;
  videoPlaying = false;

  pendingTracks = [];
  activeTrackers = [];
  nextTrackerId = 1;


  document.getElementById(
    'status'
  ).innerText =
    'Loading video...';


  document.getElementById(
    'playBtn'
  ).style.display =
    'none';


  document.getElementById(
    'chooseBtn'
  ).style.display =
    'inline-block';


  vid =
    createVideo(
      currentVideoURL
    );


  vid.hide();


  vid.elt.playsInline = true;

  vid.elt.setAttribute(
    'playsinline',
    ''
  );

  vid.elt.setAttribute(
    'webkit-playsinline',
    ''
  );


  /*
    LOAD MUTED

    Audio is restored when
    PLAY VIDEO is tapped.
  */

  vid.elt.muted = true;
  vid.elt.defaultMuted = true;
  vid.elt.volume = 0;

  vid.elt.preload = 'auto';


  vid.elt.addEventListener(
    'loadedmetadata',
    prepareVideo,
    {once:true}
  );


  vid.elt.addEventListener(
    'error',
    function(){

      document.getElementById(
        'status'
      ).innerText =
        'Video could not load.';
    }
  );
}


/*
  PREP VIDEO
*/

function prepareVideo(){

  resetAnalysisBuffers();

  videoLoaded = true;


  document.getElementById(
    'status'
  ).innerText =
    'Video ready. Tap PLAY VIDEO.';


  document.getElementById(
    'playBtn'
  ).style.display =
    'inline-block';


  document.getElementById(
    'chooseBtn'
  ).style.display =
    'inline-block';
}


/*
  RESET
*/

function resetAnalysisBuffers(){

  prevFrame =
    createImage(
      analysisW,
      analysisH
    );

  diffImg =
    createImage(
      analysisW,
      analysisH
    );


  prevFrame.loadPixels();


  for(
    let i = 0;
    i < prevFrame.pixels.length;
    i += 4
  ){

    prevFrame.pixels[i] = 0;
    prevFrame.pixels[i+1] = 0;
    prevFrame.pixels[i+2] = 0;
    prevFrame.pixels[i+3] = 255;
  }


  prevFrame.updatePixels();


  pendingTracks = [];
  activeTrackers = [];
  nextTrackerId = 1;

  haloLayer.clear();
}


/*
  PLAY
*/

function startVideoPlayback(){

  if(
    !vid ||
    !videoLoaded
  ){
    return;
  }


  resetAnalysisBuffers();


  if(
    vid.elt.ended ||
    vid.elt.currentTime >= vid.elt.duration
  ){

    vid.elt.currentTime = 0;
  }


  /*
    RESTORE ORIGINAL AUDIO
  */

  vid.elt.muted = false;
  vid.elt.defaultMuted = false;
  vid.elt.volume = 1.0;


  const playPromise =
    vid.elt.play();


  if(
    playPromise !== undefined
  ){

    playPromise
      .then(() => {

        videoPlaying = true;


        document.getElementById(
          'playBtn'
        ).style.display =
          'none';


        document.getElementById(
          'chooseBtn'
        ).style.display =
          'none';


        document.getElementById(
          'status'
        ).innerText =
          '';

      })

      .catch(() => {

        document.getElementById(
          'status'
        ).innerText =
          'Tap PLAY VIDEO again.';


        document.getElementById(
          'playBtn'
        ).style.display =
          'inline-block';


        document.getElementById(
          'chooseBtn'
        ).style.display =
          'inline-block';
      });
  }
}


/*
  MAIN LOOP
*/

function draw(){

  background(0);


  if(
    !videoLoaded ||
    !vid
  ){

    drawStartScreen();

    return;
  }


  /*
    FULL-QUALITY VIDEO
  */

  drawVideoCover();


  if(
    !videoPlaying ||
    vid.elt.paused
  ){

    return;
  }


  /*
    LOW-RES COPY FOR ANALYSIS
  */

  analysisLayer.clear();

  analysisLayer.image(
    vid,
    0,
    0,
    analysisW,
    analysisH
  );


  analysisFrame =
    analysisLayer.get();


  analysisFrame.loadPixels();
  prevFrame.loadPixels();


  if(
    analysisFrame.pixels.length === 0 ||
    prevFrame.pixels.length === 0
  ){

    return;
  }


  diffImg.loadPixels();


  /*
    FRAME DIFFERENCE
  */

  for(
    let i = 0;
    i < analysisFrame.pixels.length;
    i += 4
  ){

    let d =
      dist(

        analysisFrame.pixels[i],
        analysisFrame.pixels[i+1],
        analysisFrame.pixels[i+2],

        prevFrame.pixels[i],
        prevFrame.pixels[i+1],
        prevFrame.pixels[i+2]

      );


    let v =
      d > motionThreshold
      ? 255
      : 0;


    diffImg.pixels[i] = v;
    diffImg.pixels[i+1] = v;
    diffImg.pixels[i+2] = v;
    diffImg.pixels[i+3] = 255;
  }


  diffImg.updatePixels();


  /*
    RAW BLOBS
  */

  let rawBlobs =
    findBlobs(
      diffImg,
      analysisW,
      analysisH
    );


  /*
    LOCK-ON
  */

  blobs =
    applyLockOn(
      rawBlobs
    );


  /*
    UPDATE PERSISTENT TRACKERS
  */

  updateActiveTrackers(
    blobs
  );


  /*
    GOLD HALO FADE
  */

  haloLayer.fill(
    0,
    0,
    0,
    62
  );

  haloLayer.noStroke();

  haloLayer.rect(
    0,
    0,
    width,
    height
  );


  let t =
    millis()/1000;


  let pulse =
    (
      sin(
        t * 1.2
      ) + 1
    ) / 2;


  let fit =
    getCoverFit();


  let centers = [];


  for(
    let tracker of activeTrackers
  ){

    if(
      tracker.missedFrames > 1
    ){
      continue;
    }


    let normalizedX =
      tracker.x / analysisW;

    let normalizedY =
      tracker.y / analysisH;


    let cx =
      fit.x +
      normalizedX *
      fit.w;


    let cy =
      fit.y +
      normalizedY *
      fit.h;


    tracker.screenX =
      cx;

    tracker.screenY =
      cy;


    centers.push({
      x:cx,
      y:cy,
      tracker:tracker
    });


    let goldHue =
      sonicGold +
      sin(
        t * 0.7 +
        tracker.x * 0.04
      ) * 6;


    let haloSize =
      map(
        tracker.blob.count,
        minBlobPixels,
        3000,
        43,
        100
      );


    haloSize =
      constrain(
        haloSize,
        43,
        100
      );


    drawGoldHalo(
      haloLayer,
      cx,
      cy,
      haloSize,
      goldHue,
      pulse
    );
  }


  /*
    GOLD GLOW
  */

  blendMode(ADD);

  image(
    haloLayer,
    0,
    0
  );

  blendMode(BLEND);


  /*
    SPEED-REACTIVE BLUE TRAILS
  */

  drawVelocityTrails();


  /*
    NETWORK LINES
  */

  drawConnectorLines(
    centers
  );


  /*
    TRACKER GRAPHICS
  */

  drawTrackers(
    centers
  );


  /*
    SAVE FRAME
  */

  prevFrame.copy(
    analysisFrame,
    0,
    0,
    analysisW,
    analysisH,
    0,
    0,
    analysisW,
    analysisH
  );


  /*
    VIDEO END
  */

  if(
    vid.elt.ended
  ){

    videoPlaying = false;

    pendingTracks = [];
    activeTrackers = [];


    document.getElementById(
      'playBtn'
    ).style.display =
      'inline-block';


    document.getElementById(
      'chooseBtn'
    ).style.display =
      'inline-block';


    document.getElementById(
      'status'
    ).innerText =
      'Video finished. Tap PLAY VIDEO to replay.';
  }
}


/*
  LOCK-ON
*/

function applyLockOn(
  rawBlobs
){

  let confirmed = [];
  let usedTracks = new Set();


  for(
    let blob of rawBlobs
  ){

    let bx =
      (blob.minX + blob.maxX) / 2;

    let by =
      (blob.minY + blob.maxY) / 2;


    let bestIndex =
      -1;

    let bestDistance =
      Infinity;


    for(
      let i = 0;
      i < pendingTracks.length;
      i++
    ){

      if(
        usedTracks.has(i)
      ){
        continue;
      }


      let tr =
        pendingTracks[i];


      let d =
        dist(
          bx,
          by,
          tr.x,
          tr.y
        );


      if(
        d < lockDistance &&
        d < bestDistance
      ){

        bestDistance =
          d;

        bestIndex =
          i;
      }
    }


    if(
      bestIndex >= 0
    ){

      let tr =
        pendingTracks[
          bestIndex
        ];


      tr.x = bx;
      tr.y = by;

      tr.framesSeen++;

      tr.missedFrames = 0;

      tr.blob = blob;


      usedTracks.add(
        bestIndex
      );


      if(
        tr.framesSeen >=
        lockFrames
      ){

        confirmed.push(
          blob
        );
      }

    } else {


      pendingTracks.push({

        x:bx,
        y:by,

        framesSeen:1,
        missedFrames:0,

        blob:blob
      });
    }
  }


  for(
    let i = 0;
    i < pendingTracks.length;
    i++
  ){

    if(
      !usedTracks.has(i)
    ){

      pendingTracks[i]
        .missedFrames++;
    }
  }


  pendingTracks =
    pendingTracks.filter(
      track =>
        track.missedFrames <= 1
    );


  return confirmed;
}


/*
  PERSISTENT TRACKERS

  This allows each blob to keep
  its own motion history.
*/

function updateActiveTrackers(
  confirmedBlobs
){

  let matchedTrackerIds =
    new Set();


  for(
    let blob of confirmedBlobs
  ){

    let bx =
      (blob.minX +
       blob.maxX) / 2;

    let by =
      (blob.minY +
       blob.maxY) / 2;


    let bestTracker =
      null;

    let bestDistance =
      Infinity;


    for(
      let tracker of activeTrackers
    ){

      if(
        matchedTrackerIds.has(
          tracker.id
        )
      ){
        continue;
      }


      let d =
        dist(
          bx,
          by,
          tracker.x,
          tracker.y
        );


      if(
        d < 75 &&
        d < bestDistance
      ){

        bestDistance =
          d;

        bestTracker =
          tracker;
      }
    }


    /*
      UPDATE EXISTING TRACKER
    */

    if(
      bestTracker
    ){

      let previousX =
        bestTracker.x;

      let previousY =
        bestTracker.y;


      bestTracker.x =
        bx;

      bestTracker.y =
        by;


      bestTracker.velocity =
        dist(
          previousX,
          previousY,
          bx,
          by
        );


      bestTracker.blob =
        blob;

      bestTracker.missedFrames =
        0;


      bestTracker.history.push({

        x:bx,
        y:by,
        velocity:
          bestTracker.velocity
      });


      if(
        bestTracker.history.length >
        maxTrailHistory
      ){

        bestTracker.history.shift();
      }


      matchedTrackerIds.add(
        bestTracker.id
      );

    } else {


      /*
        CREATE NEW TRACKER
      */

      let tracker = {

        id:
          nextTrackerId++,

        x:bx,
        y:by,

        velocity:0,

        missedFrames:0,

        blob:blob,

        history:[
          {
            x:bx,
            y:by,
            velocity:0
          }
        ]
      };


      activeTrackers.push(
        tracker
      );


      matchedTrackerIds.add(
        tracker.id
      );
    }
  }


  /*
    AGE MISSING TRACKERS
  */

  for(
    let tracker of activeTrackers
  ){

    if(
      !matchedTrackerIds.has(
        tracker.id
      )
    ){

      tracker.missedFrames++;
    }
  }


  activeTrackers =
    activeTrackers.filter(
      tracker =>
        tracker.missedFrames <= 2
    );
}


/*
  SPEED-REACTIVE TRAILS
*/

function drawVelocityTrails(){

  let fit =
    getCoverFit();


  for(
    let tracker of activeTrackers
  ){

    if(
      tracker.history.length < 2
    ){
      continue;
    }


    /*
      CURRENT VELOCITY

      Low movement stays subtle.

      Fast motion becomes brighter,
      thicker and longer.
    */

    let speed =
      tracker.velocity *
      velocityTrailStrength;


    let trailStrength =
      constrain(
        map(
          speed,
          0,
          35,
          0.15,
          1
        ),
        0.15,
        1
      );


    let maxSegments =
      floor(
        map(
          speed,
          0,
          35,
          2,
          maxTrailHistory
        )
      );


    maxSegments =
      constrain(
        maxSegments,
        2,
        maxTrailHistory
      );


    let start =
      max(
        1,
        tracker.history.length -
        maxSegments
      );


    for(
      let i = start;
      i < tracker.history.length;
      i++
    ){

      let a =
        tracker.history[
          i-1
        ];

      let b =
        tracker.history[
          i
        ];


      let x1 =
        fit.x +
        (a.x / analysisW) *
        fit.w;


      let y1 =
        fit.y +
        (a.y / analysisH) *
        fit.h;


      let x2 =
        fit.x +
        (b.x / analysisW) *
        fit.w;


      let y2 =
        fit.y +
        (b.y / analysisH) *
        fit.h;


      let localSpeed =
        b.velocity *
        velocityTrailStrength;


      let alpha =
        constrain(
          map(
            localSpeed,
            0,
            35,
            20,
            100
          ),
          20,
          100
        );


      let weight =
        constrain(
          map(
            localSpeed,
            0,
            35,
            1.5,
            7
          ),
          1.5,
          7
        );


      /*
        OUTER BLUE GLOW
      */

      stroke(
        sonicBlue,
        100,
        100,
        alpha * 0.25
      );

      strokeWeight(
        weight * 3
      );


      line(
        x1,
        y1,
        x2,
        y2
      );


      /*
        MAIN ELECTRIC BLUE TRAIL
      */

      stroke(
        sonicBlue,
        100,
        100,
        alpha
      );

      strokeWeight(
        weight
      );


      line(
        x1,
        y1,
        x2,
        y2
      );


      /*
        WHITE HOT CENTER

        Only appears during
        faster movement.
      */

      if(
        localSpeed > 16
      ){

        stroke(
          0,
          0,
          100,
          map(
            localSpeed,
            16,
            35,
            10,
            72
          )
        );


        strokeWeight(
          max(
            1,
            weight * 0.25
          )
        );


        line(
          x1,
          y1,
          x2,
          y2
        );
      }
    }


    /*
      EXTRA SPEED STREAK

      Fast movement extends a line
      backward from current motion.
    */

    if(
      tracker.history.length >= 2 &&
      speed > 10
    ){

      let last =
        tracker.history[
          tracker.history.length-1
        ];

      let previous =
        tracker.history[
          tracker.history.length-2
        ];


      let dx =
        last.x -
        previous.x;

      let dy =
        last.y -
        previous.y;


      let mag =
        sqrt(
          dx*dx +
          dy*dy
        );


      if(
        mag > 0
      ){

        let length =
          constrain(
            speed *
            5 *
            velocityTrailStrength,
            0,
            maxTrailLength
          );


        let ux =
          dx / mag;

        let uy =
          dy / mag;


        let currentX =
          fit.x +
          (last.x / analysisW) *
          fit.w;


        let currentY =
          fit.y +
          (last.y / analysisH) *
          fit.h;


        /*
          Convert analysis-space
          direction to screen scale.
        */

        let scaleX =
          fit.w / analysisW;

        let scaleY =
          fit.h / analysisH;


        let tailX =
          currentX -
          ux *
          length *
          scaleX;


        let tailY =
          currentY -
          uy *
          length *
          scaleY;


        /*
          BIG SOFT SPEED GLOW
        */

        stroke(
          sonicBlue,
          100,
          100,
          18
        );

        strokeWeight(14);


        line(
          tailX,
          tailY,
          currentX,
          currentY
        );


        /*
          ELECTRIC CORE
        */

        stroke(
          sonicBlue,
          100,
          100,
          88
        );

        strokeWeight(4);


        line(
          tailX,
          tailY,
          currentX,
          currentY
        );
      }
    }
  }
}


/*
  NETWORK CONNECTIONS
*/

function drawConnectorLines(
  centers
){

  if(
    centers.length < 2
  ){
    return;
  }


  stroke(
    sonicBlue,
    95,
    100,
    82
  );

  strokeWeight(2.5);


  for(
    let i = 0;
    i < centers.length-1;
    i++
  ){

    line(
      centers[i].x,
      centers[i].y,
      centers[i+1].x,
      centers[i+1].y
    );


    let mx =
      (
        centers[i].x +
        centers[i+1].x
      ) / 2;


    let my =
      (
        centers[i].y +
        centers[i+1].y
      ) / 2;


    noStroke();


    fill(
      sonicBlue,
      90,
      100,
      100
    );


    circle(
      mx,
      my,
      7
    );


    fill(
      0,
      0,
      100,
      100
    );


    circle(
      mx,
      my,
      2.5
    );


    stroke(
      sonicBlue,
      95,
      100,
      82
    );

    strokeWeight(2.5);
  }
}


/*
  TRACKER GRAPHICS
*/

function drawTrackers(
  centers
){

  for(
    let p of centers
  ){

    let tracker =
      p.tracker;

    let b =
      tracker.blob;

    let cx =
      p.x;

    let cy =
      p.y;


    let side =
      map(
        b.count,
        minBlobPixels,
        3000,
        90,
        185
      );


    side =
      constrain(
        side,
        90,
        185
      );


    let half =
      side / 2;


    /*
      BLUE BOX
    */

    stroke(
      sonicBlue,
      100,
      100,
      100
    );

    strokeWeight(3.5);

    noFill();


    rect(
      cx-half,
      cy-half,
      side,
      side,
      4
    );


    /*
      WHITE CORNERS
    */

    let corner =
      19;


    stroke(
      0,
      0,
      100,
      100
    );

    strokeWeight(4);


    line(cx-half,cy-half,cx-half+corner,cy-half);
    line(cx-half,cy-half,cx-half,cy-half+corner);

    line(cx+half,cy-half,cx+half-corner,cy-half);
    line(cx+half,cy-half,cx+half,cy-half+corner);

    line(cx-half,cy+half,cx-half+corner,cy+half);
    line(cx-half,cy+half,cx-half,cy+half-corner);

    line(cx+half,cy+half,cx+half-corner,cy+half);
    line(cx+half,cy+half,cx+half,cy+half-corner);


    /*
      BLUE CROSSHAIR
    */

    stroke(
      sonicBlue,
      100,
      100,
      100
    );

    strokeWeight(3);


    line(
      cx-19,
      cy,
      cx+19,
      cy
    );


    line(
      cx,
      cy-19,
      cx,
      cy+19
    );


    /*
      WHITE TARGET
    */

    noFill();

    stroke(
      0,
      0,
      100,
      100
    );

    strokeWeight(2.5);


    circle(
      cx,
      cy,
      20
    );


    /*
      GOLD CENTER
    */

    noStroke();

    fill(
      sonicGold,
      100,
      100,
      100
    );


    circle(
      cx,
      cy,
      8
    );


    /*
      BLUE SCAN LINE
    */

    stroke(
      sonicBlue,
      100,
      100,
      100
    );

    strokeWeight(4);


    let scanY =
      cy +
      sin(
        millis()/180
      ) *
      half *
      0.65;


    line(
      cx-half+10,
      scanY,
      cx+half-10,
      scanY
    );


    /*
      COORDINATES
    */

    let label =
      `(${int(cx)}, ${int(cy)})`;


    textAlign(
      CENTER,
      CENTER
    );

    textSize(20);

    textStyle(BOLD);


    let labelWidth =
      textWidth(label) + 20;


    let labelHeight =
      30;


    let labelY =
      cy-half-28;


    noStroke();

    fill(
      0,
      0,
      0,
      80
    );


    rect(
      cx-labelWidth/2,
      labelY-labelHeight/2,
      labelWidth,
      labelHeight,
      3
    );


    noFill();

    stroke(
      sonicBlue,
      100,
      100,
      100
    );

    strokeWeight(2);


    rect(
      cx-labelWidth/2,
      labelY-labelHeight/2,
      labelWidth,
      labelHeight,
      3
    );


    noStroke();

    fill(
      0,
      0,
      100,
      100
    );


    text(
      label,
      cx,
      labelY
    );
  }
}


/*
  GOLD HALO
*/

function drawGoldHalo(
  layer,
  x,
  y,
  r,
  goldHue,
  pulse
){

  layer.push();

  layer.translate(
    x,
    y
  );

  layer.noFill();


  layer.stroke(
    goldHue,
    90,
    100,
    8
  );

  layer.strokeWeight(16);

  layer.circle(
    0,
    0,
    r * 2.08
  );


  layer.stroke(
    goldHue,
    90,
    100,
    13
  );

  layer.strokeWeight(8);

  layer.circle(
    0,
    0,
    r * 2.03
  );


  for(
    let i = 0;
    i < 3;
    i++
  ){

    let alpha =
      map(
        i,
        0,
        2,
        58,
        16
      );


    layer.stroke(
      goldHue,
      92,
      100,
      alpha
    );


    layer.strokeWeight(
      map(
        i,
        0,
        2,
        4.5,
        1.5
      )
    );


    let ringSize =
      r *
      (
        1 +
        0.018 *
        pulse
      );


    layer.circle(
      0,
      0,
      ringSize*2
    );


    r *= 0.86;
  }


  layer.noStroke();


  for(
    let i = 0;
    i < 8;
    i++
  ){

    let a =
      TWO_PI *
      i/8 +
      millis()/2500;


    let orbit =
      r * 1.48;


    layer.fill(
      goldHue,
      90,
      100,
      30
    );


    layer.circle(
      cos(a)*orbit,
      sin(a)*orbit,
      2.5
    );
  }


  layer.pop();
}


/*
  HIGH-QUALITY VIDEO
*/

function drawVideoCover(){

  let fit =
    getCoverFit();


  image(
    vid,
    fit.x,
    fit.y,
    fit.w,
    fit.h
  );
}


/*
  VIDEO COVER FIT
*/

function getCoverFit(){

  let vw =
    vid.elt.videoWidth;

  let vh =
    vid.elt.videoHeight;


  if(
    !vw ||
    !vh
  ){

    return{
      x:0,
      y:0,
      w:width,
      h:height
    };
  }


  let videoRatio =
    vw / vh;

  let screenRatio =
    width / height;


  let drawW;
  let drawH;


  if(
    screenRatio >
    videoRatio
  ){

    drawW =
      width;

    drawH =
      width /
      videoRatio;

  } else {

    drawH =
      height;

    drawW =
      height *
      videoRatio;
  }


  return{

    x:
      (width-drawW)/2,

    y:
      (height-drawH)/2,

    w:
      drawW,

    h:
      drawH
  };
}

/*
  FIND BLOBS
*/

function findBlobs(
  img,
  w,
  h
){

  let visited =
    new Uint8Array(
      w*h
    );


  img.loadPixels();


  let found = [];


  for(
    let y = 0;
    y < h;
    y++
  ){

    for(
      let x = 0;
      x < w;
      x++
    ){

      let idx =
        x +
        y*w;


      let p =
        img.pixels[
          idx*4
        ];


      if(
        p > 128 &&
        !visited[idx]
      ){

        let b =
          flood(
            x,
            y,
            visited,
            img,
            w,
            h
          );


        if(
          b.count >
          minBlobPixels
        ){

          found.push(
            b
          );
        }
      }
    }
  }


  return found;
}


/*
  FLOOD FILL
*/

function flood(
  x,
  y,
  vis,
  img,
  w,
  h
){

  let st =
    [[x,y]];


  let minX = x;
  let maxX = x;

  let minY = y;
  let maxY = y;

  let c = 0;


  while(
    st.length
  ){

    let [
      cx,
      cy
    ] =
      st.pop();


    if(
      cx < 0 ||
      cy < 0 ||
      cx >= w ||
      cy >= h
    ){
      continue;
    }


    let idx =
      cx +
      cy*w;


    if(
      vis[idx]
    ){
      continue;
    }


    let p =
      idx*4;


    if(
      img.pixels[p] <= 128
    ){
      continue;
    }


    vis[idx] = 1;

    c++;


    minX =
      min(
        minX,
        cx
      );


    maxX =
      max(
        maxX,
        cx
      );


    minY =
      min(
        minY,
        cy
      );


    maxY =
      max(
        maxY,
        cy
      );


    st.push(
      [cx+1,cy],
      [cx-1,cy],
      [cx,cy+1],
      [cx,cy-1]
    );
  }


  return{
    minX,
    maxX,
    minY,
    maxY,
    count:c
  };
}


/*
  RESIZE
*/

function windowResized(){

  resizeCanvas(
    windowWidth,
    windowHeight
  );


  haloLayer =
    createGraphics(
      width,
      height
    );


  haloLayer.colorMode(
    HSB,
    360,
    100,
    100,
    100
  );


  haloLayer.clear();


  pendingTracks = [];
  activeTrackers = [];
}
